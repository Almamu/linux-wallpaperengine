name: CodeFactor diagnostics

on:
  push:
    branches:
      - codex/upstream-review
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analyzers
        run: |
          python -m pip install --disable-pip-version-check \
            pylint==3.3.7 pycodestyle==2.14.0 bandit==1.9.4 \
            ruff==0.15.14 cpplint==2.0.2 flawfinder==2.0.19 \
            yamllint==1.38.0 lizard==1.17.31
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Collect changed files
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Python analyzers
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.py$' /tmp/changed.txt || true)
          (("${#files[@]}" == 0)) && exit 0
          echo '=== PYLINT ==='
          pylint --score=n --reports=n "${files[@]}" || true
          echo '=== PYCODESTYLE ==='
          pycodestyle "${files[@]}" || true
          echo '=== BANDIT ==='
          bandit -q "${files[@]}" || true
          echo '=== RUFF ==='
          ruff check "${files[@]}" || true

      - name: C and C++ analyzers
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.(c|cc|cpp|cxx|h|hpp)$' /tmp/changed.txt || true)
          (("${#files[@]}" == 0)) && exit 0
          echo '=== CPPLINT ==='
          cpplint "${files[@]}" || true
          echo '=== FLAWFINDER ==='
          flawfinder --minlevel=1 "${files[@]}" || true
          echo '=== LIZARD CCN>=15 ==='
          lizard -C 15 "${files[@]}" || true

      - name: Shell analyzers
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.sh$' /tmp/changed.txt || true)
          (("${#files[@]}" == 0)) && exit 0
          shellcheck "${files[@]}" || true

      - name: YAML analyzer
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.(yml|yaml)$' /tmp/changed.txt || true)
          (("${#files[@]}" == 0)) && exit 0
          yamllint "${files[@]}" || true
